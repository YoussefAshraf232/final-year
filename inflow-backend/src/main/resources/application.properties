# App
spring.application.name=inflow
server.port=9090

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.default-schema=public

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Default profile
spring.profiles.active=dev
spring.datasource.url=${INFLOW_DB_URL:jdbc:postgresql://localhost:5432/inflow_db}
spring.datasource.username=${INFLOW_DB_USERNAME:postgres}
spring.datasource.password=${INFLOW_DB_PASSWORD:postgres}
inflow.jwt.secret=${INFLOW_JWT_SECRET:}
inflow.jwt.expiration-minutes=${INFLOW_JWT_EXPIRATION_MINUTES:480}
inflow.allowed-origins=${INFLOW_ALLOWED_ORIGINS:http://localhost:3000}

