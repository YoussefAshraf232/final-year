services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${INFLOW_DB_NAME:-inflow_db}
      POSTGRES_USER: ${INFLOW_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${INFLOW_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - inflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFLOW_DB_USERNAME:-postgres} -d ${INFLOW_DB_NAME:-inflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./inflow-backend
    environment:
      INFLOW_DB_URL: jdbc:postgresql://db:5432/${INFLOW_DB_NAME:-inflow_db}
      INFLOW_DB_USERNAME: ${INFLOW_DB_USERNAME:-postgres}
      INFLOW_DB_PASSWORD: ${INFLOW_DB_PASSWORD:-postgres}
      INFLOW_JWT_SECRET: ${INFLOW_JWT_SECRET}
      INFLOW_ALLOWED_ORIGINS: ${INFLOW_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9090}
        NEXT_PUBLIC_ENABLE_GUEST_MODE: ${NEXT_PUBLIC_ENABLE_GUEST_MODE:-false}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:9090}
      NEXT_PUBLIC_ENABLE_GUEST_MODE: ${NEXT_PUBLIC_ENABLE_GUEST_MODE:-false}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  inflow_pgdata:
